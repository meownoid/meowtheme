[project]
name = "meowtheme"
version = "0.1.0"
description = "Generate editor theme artifacts from a Base16 color scheme."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
meowtheme = "meowtheme.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
